<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    #selection {
      position: fixed;
      pointer-events: none;
      border: 2px solid #3b82f6;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #e2e8f0;
      font: 14px system-ui, sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection" style="display: none;"></div>
  <div id="hint">Click and drag on your screen to select the capture area · Esc to cancel</div>
  <script>
    (function() {
      const selection = document.getElementById('selection');
      let startX = 0, startY = 0;
      let dragging = false;

      function getBounds() {
        return window.__PICKER_BOUNDS__ || { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
      }

      function toScreen(clientX, clientY) {
        const b = getBounds();
        return {
          x: Math.round(b.x + (clientX / window.innerWidth) * b.width),
          y: Math.round(b.y + (clientY / window.innerHeight) * b.height)
        };
      }

      document.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        dragging = true;
        const p = toScreen(e.clientX, e.clientY);
        startX = p.x;
        startY = p.y;
        selection.style.display = 'block';
        selection.style.left = e.clientX + 'px';
        selection.style.top = e.clientY + 'px';
        selection.style.width = '0';
        selection.style.height = '0';
      });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        const b = getBounds();
        const startPxX = (startX - b.x) * window.innerWidth / b.width;
        const startPxY = (startY - b.y) * window.innerHeight / b.height;
        const left = Math.min(startPxX, e.clientX);
        const top = Math.min(startPxY, e.clientY);
        const width = Math.abs(e.clientX - startPxX);
        const height = Math.abs(e.clientY - startPxY);
        selection.style.left = left + 'px';
        selection.style.top = top + 'px';
        selection.style.width = width + 'px';
        selection.style.height = height + 'px';
      });

      document.addEventListener('mouseup', function(e) {
        if (e.button !== 0 || !dragging) return;
        dragging = false;
        const end = toScreen(e.clientX, e.clientY);
        const x = Math.min(startX, end.x);
        const y = Math.min(startY, end.y);
        const width = Math.max(1, Math.abs(end.x - startX));
        const height = Math.max(1, Math.abs(end.y - startY));
        if (window.regionPicker && width >= 1 && height >= 1) {
          window.regionPicker.sendRegion(x, y, width, height);
        }
        selection.style.display = 'none';
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && window.regionPicker) {
          window.regionPicker.cancel();
        }
      });
    })();
  </script>
</body>
</html>
